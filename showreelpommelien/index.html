<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>Showreel Pommelien Thijs</title>
<link rel="icon" href="data:,">
<style>
  :root { --fade: 1800ms; --tile: 900ms; }
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; cursor: none; }
  body {
    font: 500 1rem/1.4 -apple-system, "Helvetica Neue", Helvetica, Arial, sans-serif;
    color: #8a8580; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
  }
  #stage { position: fixed; inset: 0; background: #000; }
  .screen {
    position: absolute; inset: 0; opacity: 0;
    transition: opacity var(--fade) cubic-bezier(.4, 0, .2, 1); will-change: opacity;
  }
  .screen.is-on { opacity: 1; }
  .screen.is-off { opacity: 0; }
  figure {
    position: absolute; margin: 0; overflow: hidden; background: #000; opacity: 0;
    transform: translateZ(0);
  }
  figure img {
    display: block; width: 100%; height: 100%; object-fit: contain;
  }
  .screen.is-on figure { opacity: 1; transition: opacity var(--tile) ease-out; transition-delay: var(--delay, 0ms); }
  #note {
    position: fixed; left: 50%; bottom: 6vh; transform: translateX(-50%);
    padding: .55em 1.1em; border: 1px solid #2a2724; border-radius: .6em; background: #0a0908;
    font-size: clamp(14px, 1.2vw, 26px); letter-spacing: .02em; opacity: 0; transition: opacity 300ms;
    pointer-events: none; white-space: nowrap;
  }
  #note.is-on { opacity: 1; }
  body.is-still .screen, body.is-still figure { transition: none !important; }
  @media (prefers-reduced-motion: reduce) {
    :root { --fade: 500ms; --tile: 300ms; }
    .screen.is-on figure { transition-delay: 0ms !important; }
  }
</style>
</head>
<body>
<div id="stage" aria-label="Showreel Pommelien Thijs"></div>
<div id="note" role="status" aria-live="polite"></div>
<script>
(() => {
  'use strict';
  const q = new URLSearchParams(location.search);
  const TEMPO = Math.min(4, Math.max(0.25, parseFloat(q.get('tempo')) || 1));
  const STILL = q.has('still') ? (parseInt(q.get('still'), 10) || 0) : null;
  const ONLY = q.get('only');                   // QA: force one screen type (collage, wand)
  const SEED = q.has('seed') ? (parseInt(q.get('seed'), 10) || 1) : (STILL !== null ? 1 : null);
  const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const FADE = STILL !== null ? 0 : (REDUCED ? 500 : 1800);
  const WINDOW = 12;
  const stage = document.getElementById('stage');
  const note = document.getElementById('note');
  if (STILL !== null) document.body.classList.add('is-still');

  // Random source: seeded (QA, deterministic) or Math.random (TV).
  let rnd = Math.random;
  if (SEED !== null) {
    let a = SEED >>> 0;
    rnd = () => { a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
    for (let i = 0; i < 24; i++) rnd();         // warm-up: neighbouring seeds otherwise start alike
  }
  const shuffle = arr => { for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; } return arr; };
  const weighted = items => { const sum = items.reduce((s, i) => s + i.weight, 0); let r = rnd() * sum; for (const i of items) { r -= i.weight; if (r <= 0) return i; } return items[items.length - 1]; };

  // ---- Screen grammar: justified rows, nothing is ever cropped ---------------------------
  // Every photo keeps its own aspect ratio (object-fit: contain as a safety net). A screen is one
  // or two rows; the photos in a row stand side by side at one height and the row spans the
  // width. When the rows together are taller than the screen, the whole block shrinks (gaps stay)
  // until it fits. What is left is black. No zoom, no crop, no filter.
  // Lester (29/10): always at least 5 photos per screen. Every structure below holds 5 to 8.
  const MIN_PHOTOS = 5;
  const STRUCTURES = [[5], [2, 3], [3, 2], [3, 3], [2, 4], [4, 2], [3, 4], [4, 3], [4, 4]];
  const CLASS = n => (n <= 6 ? 'collage' : 'wand');
  const CLASS_WEIGHT = { collage: 4, wand: 2.5 };
  const MIN_COVER = 0.52;                      // share of the screen the photos must cover
  const SAME_SET = 0.06;                       // score penalty per extra photo from one set
  const HOLD = n => Math.min(15000, 7000 + n * 1000);

  // rows: arrays of ratios. Returns { cells, coverage, ok } with cells in row order.
  function layout(rows, W, H, g) {
    const hs = rows.map(r => (W - (r.length - 1) * g) / r.reduce((a, x) => a + x, 0));
    const k = Math.min(1, (H - (rows.length - 1) * g) / hs.reduce((a, h) => a + h, 0));
    const rowH = hs.map(h => h * k);
    const blockH = rowH.reduce((a, h) => a + h, 0) + (rows.length - 1) * g;
    let y = (H - blockH) / 2, area = 0;
    const cells = [];
    rows.forEach((r, i) => {
      const h = rowH[i], widths = r.map(x => x * h);
      let x = (W - (widths.reduce((a, w) => a + w, 0) + (r.length - 1) * g)) / 2;
      widths.forEach(w => { cells.push({ x, y, w, h }); area += w * h; x += w + g; });
      y += h + g;
    });
    const ok = Math.max(...rowH) / Math.min(...rowH) <= 2.2 && Math.min(...rowH) >= H * 0.24;
    return { cells, coverage: area / (W * H), ok };
  }

  // ---- Sequence -------------------------------------------------------------------------
  // The queue is topped up with a fresh shuffle before it runs dry, so the window always holds
  // enough photos for a full collage. Photos shown recently go to the back of that shuffle, so the
  // end of one round never repeats right at the start of the next. The first photo in the queue is
  // always on the next screen, so every photo gets its turn.
  let photos = [], queue = [], lastName = null;
  const recent = [];
  function refill() {
    const inQueue = new Set(queue.map(p => p.id));
    const keep = Math.min(120, Math.floor(photos.length * 0.4));
    const late = new Set(recent.slice(-keep));
    const fresh = shuffle(photos.filter(p => !inQueue.has(p.id)));
    queue.push(...fresh.filter(p => !late.has(p.id)), ...fresh.filter(p => late.has(p.id)));
  }
  function geometry() { const W = innerWidth, H = innerHeight; return { W, H, g: Math.max(4, Math.round(W * 0.0055)) }; }

  // ERAS (Lester, 29/10): one screen never mixes eras (per-ongeluk, gedoe, ...). The era of the
  // first photo in the queue decides the screen; the window holds only photos of that era. An era
  // with too few photos for a screen (e.g. loose, unsorted photos) joins a shared pool instead.
  let eraOf = p => p.era || 'los';
  function setupEras() {
    const n = {}; photos.forEach(p => { n[p.era || 'los'] = (n[p.era || 'los'] || 0) + 1; });
    eraOf = p => (n[p.era || 'los'] >= MIN_PHOTOS * 2 ? (p.era || 'los') : '*');
  }
  // A small era refills often; photos from its last two screens then wait at the back of the
  // window and only fill in when the era has nothing else left.
  const eraRecent = {};
  function eraWindow() {
    const era = eraOf(queue[0]);
    const inEra = () => (era === '*' ? queue.slice() : queue.filter(p => eraOf(p) === era));
    if (inEra().length < WINDOW) refill();
    const recentIds = new Set(eraRecent[era] || []);
    const all = inEra();
    const fresh = all.filter(p => !recentIds.has(p.id)), stale = all.filter(p => recentIds.has(p.id));
    if (recentIds.has(all[0].id) && fresh.length) {             // keep the queue head first if it is fresh
      const i = queue.indexOf(fresh[0]); queue.splice(i, 1); queue.unshift(fresh[0]);
    }
    return fresh.concat(stale).slice(0, WINDOW);
  }
  function rememberEra(spec) {
    const era = eraOf(spec.photos[0]);
    eraRecent[era] = (eraRecent[era + ':prev'] || []).concat(spec.photos.map(p => p.id));
    eraRecent[era + ':prev'] = spec.photos.map(p => p.id);
  }

  function makeSpec() {
    if (queue.length < WINDOW) refill();
    const { W, H, g } = geometry();
    const win = eraWindow(), first = win[0], rest = win.slice(1);
    const cands = [], loose = [];
    for (const st of STRUCTURES) {
      const n = st.reduce((a, x) => a + x, 0);
      if (n > win.length) continue;
      for (let t = 0; t < 24; t++) {
        const chosen = shuffle([first, ...shuffle(rest.slice()).slice(0, n - 1)]);
        const rows = []; let i = 0;
        for (const c of st) { rows.push(chosen.slice(i, i + c)); i += c; }
        const L = layout(rows.map(r => r.map(p => p.ratio)), W, H, g);
        const sets = chosen.map(p => p.set || p.id);
        const clashes = sets.length - new Set(sets).size;
        const cand = { rows, n, cls: CLASS(n), coverage: L.coverage, score: L.coverage - SAME_SET * clashes };
        // Never blow a photo up far beyond its own pixels (a small file would turn soft on a tv).
        const flat = rows.flat(), dpr = devicePixelRatio || 1;
        const sharp = !L.cells.some((c, j) => c.w * dpr > flat[j].w * 1.35);
        (L.ok && sharp ? cands : loose).push(cand);
      }
    }
    // Fallbacks keep the 5-photo minimum: best valid layouts, then best layouts that bend a rule,
    // and only when fewer than 5 photos exist at all, one row with everything there is.
    let pool = cands.filter(c => c.coverage >= MIN_COVER);
    if (!pool.length) pool = cands.sort((a, b) => b.score - a.score).slice(0, 3);
    if (!pool.length) pool = loose.sort((a, b) => b.score - a.score).slice(0, 3);
    if (!pool.length) pool = [{ rows: [win.slice(0, Math.min(win.length, MIN_PHOTOS))], n: Math.min(win.length, MIN_PHOTOS), cls: 'collage', score: 0 }];
    const classes = [...new Set(pool.map(c => c.cls))];
    let options = ONLY ? classes.filter(c => c === ONLY) : classes.filter(c => c !== lastName);
    if (!options.length) options = classes;
    const cls = weighted(options.map(c => ({ c, weight: CLASS_WEIGHT[c] }))).c;
    const best = pool.filter(c => c.cls === cls).sort((a, b) => b.score - a.score);
    const choice = best[Math.floor(rnd() * Math.min(3, best.length))];
    const ratios = choice.rows.map(r => r.map(p => p.ratio));
    const spec = { name: cls, hold: HOLD(choice.n), photos: choice.rows.flat(), cells: (W2, H2, g2) => layout(ratios, W2, H2, g2).cells };
    const ids = new Set(spec.photos.map(p => p.id));
    queue = queue.filter(p => !ids.has(p.id));
    rememberEra(spec);
    recent.push(...ids);
    if (recent.length > 400) recent.splice(0, recent.length - 400);
    lastName = spec.name;
    return spec;
  }

  // QA only (?sim=N): plan N screens without rendering and report repeats and set clashes.
  function simulate(n) {
    const lastSeen = new Map(), types = {}, perEra = {}; let shown = 0, minGap = Infinity, clashes = 0, gaps = [], minPer = Infinity, mixed = 0;
    for (let i = 0; i < n; i++) {
      const spec = makeSpec();
      minPer = Math.min(minPer, spec.photos.length);
      const eras = new Set(spec.photos.map(p => p.era || 'los'));
      if (eras.size > 1) mixed++;
      eras.forEach(e => { perEra[e] = (perEra[e] || 0) + 1; });
      types[spec.name] = (types[spec.name] || 0) + 1;
      const sets = spec.photos.map(p => p.set);
      clashes += sets.length - new Set(sets).size;
      for (const p of spec.photos) {
        if (lastSeen.has(p.id)) { const gap = shown - lastSeen.get(p.id); gaps.push(gap); minGap = Math.min(minGap, gap); }
        lastSeen.set(p.id, shown); shown++;
      }
    }
    gaps.sort((a, b) => a - b);
    const result = { screens: n, photosShown: shown, unique: lastSeen.size, of: photos.length, minGapPhotos: minGap, medianGap: gaps[Math.floor(gaps.length / 2)] || null, setClashes: clashes, minPhotosPerScreen: minPer, mixedEraScreens: mixed, screensPerEra: perEra, types };
    window.__sim = result; document.title = 'SIM ' + JSON.stringify(result);
    return result;
  }

  // ---- Rendering ------------------------------------------------------------------------
  // Smallest file that still fills the cell sharply: the width the photo needs once it covers the
  // cell, compared with the width of the small version (long edge M_EDGE px).
  let M_EDGE = 1200;
  const srcFor = (photo, cell) => {
    const dpr = devicePixelRatio || 1;
    const needW = Math.max(cell.w, cell.h * photo.ratio) * dpr;
    const smallW = photo.ratio >= 1 ? M_EDGE : M_EDGE * photo.ratio;
    return needW > smallW * 1.05 ? photo.l : photo.m;
  };
  function place(fig, c) { fig.style.left = c.x + 'px'; fig.style.top = c.y + 'px'; fig.style.width = c.w + 'px'; fig.style.height = c.h + 'px'; }

  function build(spec) {
    const { W, H, g } = geometry();
    const cells = spec.cells(W, H, g);
    const sec = document.createElement('section');
    sec.className = 'screen';
    sec.dataset.name = spec.name;
    spec.photos.forEach((photo, i) => {
      const fig = document.createElement('figure');
      fig.style.setProperty('--delay', (i * 120) + 'ms');
      place(fig, cells[i]);
      const img = new Image();
      img.decoding = 'async'; img.alt = ''; img.src = srcFor(photo, cells[i]);
      fig.appendChild(img);
      sec.appendChild(fig);
    });
    return sec;
  }

  function decodeAll(sec) {
    const figs = [...sec.querySelectorAll('figure')];
    const timeout = new Promise(r => setTimeout(r, 12000));
    return Promise.race([
      Promise.all(figs.map(f => f.firstChild.decode().catch(() => f.remove()))),
      timeout,
    ]).then(() => sec.querySelector('figure') !== null);
  }

  async function prepare(spec) {
    const sec = build(spec);
    stage.appendChild(sec);
    const ok = await decodeAll(sec);
    if (!ok) { sec.remove(); return null; }
    return { spec, sec };
  }
  async function prepareFresh() {
    for (let i = 0; i < 6; i++) { const r = await prepare(makeSpec()); if (r) return r; }
    return null;
  }

  let current = null, currentSpec = null;
  const history = []; let histPos = -1;
  function show(next, remember = true) {
    if (!next) return;
    if (current) { const old = current; old.classList.add('is-off'); setTimeout(() => old.remove(), FADE + 300); }
    void next.sec.offsetWidth;
    next.sec.classList.add('is-on');
    current = next.sec; currentSpec = next.spec;
    if (remember) { history.splice(histPos + 1); history.push(next.spec); if (history.length > 40) history.shift(); histPos = history.length - 1; }
  }
  function relayout() {
    const { W, H, g } = geometry();
    for (const sec of stage.querySelectorAll('.screen')) {
      const spec = sec === current ? currentSpec : sec._spec;
      if (!spec) continue;
      const cells = spec.cells(W, H, g);
      [...sec.querySelectorAll('figure')].forEach((f, i) => cells[i] && place(f, cells[i]));
    }
  }

  // ---- Clock (pausable hold) ---------------------------------------------------------------
  let paused = false, elapsed = 0, holdMs = 0, holdResolve = null;
  function holdFor(ms) { holdMs = ms; elapsed = 0; return new Promise(r => { holdResolve = r; }); }
  setInterval(() => { if (holdResolve && !paused) { elapsed += 100; if (elapsed >= holdMs) { const r = holdResolve; holdResolve = null; r(); } } }, 100);
  const skip = () => { if (holdResolve) { const r = holdResolve; holdResolve = null; r(); } };
  function setNote(text) { note.textContent = text || ''; note.classList.toggle('is-on', !!text); }

  async function run() {
    let next = await prepareFresh();
    show(next);
    for (;;) {
      const pending = prepareFresh().then(r => { if (r) r.sec._spec = r.spec; return r; });
      await holdFor(currentSpec.hold * TEMPO);
      next = await pending;
      if (!next) { setNote('Geen foto kon geladen worden'); continue; }
      show(next);
    }
  }

  async function still(n) {
    let spec = null;
    for (let i = 0; i <= n; i++) spec = makeSpec();
    show(await prepare(spec));
  }

  // ---- Keys, remote, screen ---------------------------------------------------------------
  function toggleFullscreen() {
    const el = document.documentElement;
    if (document.fullscreenElement) document.exitFullscreen?.();
    else if (el.requestFullscreen) el.requestFullscreen().catch(() => {});
    else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
  }
  addEventListener('keydown', e => {
    if (e.key === ' ') { e.preventDefault(); paused = !paused; document.body.classList.toggle('is-paused', paused); setNote(paused ? 'Pauze' : ''); }
    else if (e.key === 'ArrowRight' || e.key === 'n') { e.preventDefault(); skip(); }
    else if (e.key === 'ArrowLeft' || e.key === 'p') {
      e.preventDefault();
      if (histPos > 0) { histPos--; prepare(history[histPos]).then(r => show(r, false)); }
    }
    else if (e.key === 'f' || e.key === 'Enter') { e.preventDefault(); toggleFullscreen(); }
  });
  stage.addEventListener('click', toggleFullscreen);
  addEventListener('resize', relayout);

  let wakeLock = null;
  async function wake() { try { if ('wakeLock' in navigator && !wakeLock) { wakeLock = await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release', () => { wakeLock = null; }); } } catch (e) { wakeLock = null; } }
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') wake(); });

  fetch('photos.json', { cache: 'no-cache' })
    .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(data => {
      photos = (data.photos || []).filter(p => p.l && p.m && p.ratio > 0);
      if (data.sizes && data.sizes.m > 0) M_EDGE = data.sizes.m;
      setupEras();
      if (!photos.length) throw new Error('leeg');
      if (q.has('sim')) return simulate(parseInt(q.get('sim'), 10) || 500);
      wake();
      return STILL !== null ? still(STILL) : run();
    })
    .catch(err => setNote('Kan photos.json niet laden (' + err.message + ')'));
})();
</script>
</body>
</html>
